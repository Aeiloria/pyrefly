name: "Publish: PyPI package"

on:
  push:
    paths:
      - version.bzl
    branches: [ main, 'release/**' ]
  workflow_dispatch:

jobs:
  check_publish:
    uses: ./.github/workflows/publish_check_eligibility.yml

  build-binaries:
    name: Build binaries
    needs: check_publish
    if: needs.check_publish.outputs.should_publish == 'true'
    uses: ./.github/workflows/publish_build_packages.yml
  test:
    name: Test
    needs: check_publish
    if: needs.check_publish.outputs.should_publish == 'true'
    uses: ./.github/workflows/ci_pyrefly.yml
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - test
    environment:
      name: pypi
      url: https://pypi.org/p/pyrefly
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report deploy start to Rollouts
        id: rollouts
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: pypi
          CHANGE_MONITOR_SERVICE: pyrefly
          DEPLOY_VERSION: ${{ github.sha }}
          CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
      - name: Publish to PyPI
        id: ship
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1.14
      - name: Report deploy finish to Rollouts
        if: always()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: pypi
          CHANGE_MONITOR_SERVICE: pyrefly
          DEPLOY_VERSION: ${{ github.sha }}
          CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROLLOUTS_DEPLOYMENT: ${{ steps.rollouts.outputs.deployment }}
          ROLLOUTS_OUTCOME: ${{ steps.ship.outcome }}
        run: bash .github/scripts/rollouts-reporter.sh finish
  push-tag:
    name: Push version tag
    runs-on: ubuntu-latest
    needs: pypi-publish  # Don't push a tag unless the publish job succeeds
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get all history for all branches and tags
      - name: Get version
        id: get-version
        run: |
          # setting to variable is necessary so sed failures will be red
          VERSION=$(sed -n -e 's/^VERSION = "\(.*\)"/\1/p' version.bzl)
          echo "PYREFLY_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Tag commit
        run: git tag ${{ env.PYREFLY_VERSION }}
      - name: Push tag
        run: git push origin tag ${{ env.PYREFLY_VERSION }}
  create-release:
    name: Create release
    needs: push-tag
    uses: ./.github/workflows/publish_github_release.yml
    with:
      tag_name: ${{ needs.push-tag.outputs.version }}
    secrets:
      DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
  release-binaries:
    name: Release binaries
    needs:
      - push-tag
      - create-release
    uses: ./.github/workflows/publish_upload_binaries.yml
    with:
      tag_name: ${{ needs.push-tag.outputs.version }}
